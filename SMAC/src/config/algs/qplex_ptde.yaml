# --- PTDE specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000

batch_size_run: 8
buffer_size: 5000
batch_size: 128

# update the target network every {} episodes
target_update_interval: 200

mac: "n_ptde_mac"
agent: "ptde_rnn"
agent_output_type: "q"

learner: "qplex_learner"
double_q: True
mixer: "dmaq_qatten"
mixing_embed_dim: 32
hypernet_embed: 64
adv_hypernet_layers: 1
adv_hypernet_embed: 64

num_kernel: 4
is_minus_one: True
weighted_head: True
is_adv_attention: True
is_stop_gradient: True

n_head: 4
attend_reg_coef: 0.001
state_bias: True
mask_dead: False
weighted_head: False
nonlinear: False

burn_in_period: 100

lr: 0.001

name: "qplex_ptde"

z_dims: 64
high_hyper_hidden_dims: 64
high_mixer_hidden_dims: 32
two_hyper_layers: True
var_floor: 0.01
lambda_kl: 0.1

